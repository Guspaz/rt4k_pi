name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux ARM64 Native AOT
    # Keep glibc older than Raspberry Pi OS Bookworm (2.36).
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang zlib1g-dev

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            informational="$version"
          else
            version="0.0.0-dev.${{ github.run_number }}"
            informational="$version+${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "informational=$informational" >> "$GITHUB_OUTPUT"
          echo "Building version $informational"

      - name: Publish Release executable
        run: >-
          dotnet publish rt4k_pi.csproj
          --configuration Release
          --runtime linux-arm64
          --self-contained true
          -p:PublishAot=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.informational }}
          --output "${{ runner.temp }}/rt4k_pi-publish"

      - name: Validate executable
        run: |
          publish_dir="${{ runner.temp }}/rt4k_pi-publish"
          test -x "$publish_dir/rt4k_pi"
          readelf -h "$publish_dir/rt4k_pi" | grep -E 'Machine:.*AArch64'
          if find "$publish_dir" -type f \( -name '*.dll' -o -name '*.so' -o -name '*.so.*' \) -print -quit | grep -q .; then
            echo 'Unexpected managed or native sidecar library in single-binary publish output.' >&2
            exit 1
          fi

      - name: Write SHA-256
        working-directory: ${{ runner.temp }}/rt4k_pi-publish
        run: sha256sum rt4k_pi > rt4k_pi.sha256

      - name: Upload CI build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rt4k_pi-linux-arm64
          path: |
            ${{ runner.temp }}/rt4k_pi-publish/rt4k_pi
            ${{ runner.temp }}/rt4k_pi-publish/rt4k_pi.sha256
          if-no-files-found: error
          retention-days: 30

  image:
    name: Raspberry Pi OS image
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download CI build
        uses: actions/download-artifact@v7
        with:
          name: rt4k_pi-linux-arm64
          path: build

      - name: Verify build
        working-directory: build
        run: sha256sum --check rt4k_pi.sha256

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends parted xz-utils e2fsprogs

      - name: Build image
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            export IMAGE_VERSION="${BASH_REMATCH[1]}"
            export IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/$IMAGE_VERSION/rt4k_pi.img.xz"
          else
            export IMAGE_URL="https://example.invalid/rt4k_pi.img.xz"
          fi
          sudo --preserve-env=IMAGE_URL,IMAGE_VERSION bash image/build-image.sh build/rt4k_pi "${{ runner.temp }}/image/rt4k_pi.img.xz"

      - name: Upload image
        uses: actions/upload-artifact@v7.0.1
        with:
          name: rt4k_pi-image
          path: |
            ${{ runner.temp }}/image/rt4k_pi.img.xz
            ${{ runner.temp }}/image/rt4k_pi.img.xz.sha256
            ${{ runner.temp }}/image/rt4k_pi.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Validate tag
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got '$tag')."
            exit 1
          fi
          # Checkout can leave the tag without its annotation, so fetch the tag object itself
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          if [[ "$(git cat-file -t "$tag")" != "tag" ]]; then
            echo "::error::'$tag' is a lightweight tag. Release notes come from the tag message, so delete it and create an annotated tag instead: git tag -a $tag -F notes.md"
            exit 1
          fi
          if [[ -z "$(git for-each-ref --format='%(contents)' "refs/tags/$tag" | tr -d '[:space:]')" ]]; then
            echo "::error::'$tag' has an empty message. Write the release notes in the tag message."
            exit 1
          fi

      - name: Download CI build
        uses: actions/download-artifact@v7
        with:
          name: rt4k_pi-linux-arm64
          path: release

      - name: Download image
        uses: actions/download-artifact@v7
        with:
          name: rt4k_pi-image
          path: release

      - name: Verify build
        working-directory: release
        run: |
          chmod +x rt4k_pi
          sha256sum --check rt4k_pi.sha256
          sha256sum --check rt4k_pi.img.xz.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/rt4k_pi release/rt4k_pi.sha256
          release/rt4k_pi.img.xz release/rt4k_pi.img.xz.sha256 release/rt4k_pi.json
          --title "$GITHUB_REF_NAME"
          --notes-from-tag
          --verify-tag
